name: Static checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m compileall -q app
      - name: Pinokio JavaScript syntax
        run: |
          node --check pinokio.js
          node --check install.js
          node --check start.js
      - name: Reject common runtime artifacts
        shell: bash
        run: |
          test ! -d env
          test ! -d models
          test ! -d offload
          test ! -d work
          if find . -type f \( -name '*.safetensors' -o -name '*.pt' -o -name '*.pth' -o -name '*.ckpt' \) | grep -q .; then
            echo 'Model/checkpoint file found in repository.'
            exit 1
          fi
